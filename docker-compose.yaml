services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      MONGO_STRING: ${MONGO_STRING:?Define MONGO_STRING en .env}
      SECRET: ${SECRET:?Define SECRET en .env}
      EXP_TIME: ${EXP_TIME:-10080}
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  uploads: